 if(mode===1)html=range('carea','Área de placa',20,200,10,cap.area,'cm²')+range('cgap','Separación',.5,4,.5,cap.gap,'mm')+select('dielectric','Dieléctrico',[['1','Vacío · κ = 1'],['2','κ = 2'],['4','κ = 4']],cap.k)+group('Circuito de carga',range('cvoltage','Batería',1,12,1,cap.V,'V')+range('cres','Resistencia de carga',.5,5,.5,cap.R,'MΩ')+'<div class="buttons"><button class="btn main" id="charge">Cargar</button><button class="btn" id="discharge">Descargar</button></div><div class="buttons" style="margin-top:8px"><button class="btn" id="disconnect">Desconectar batería</button></div>')+group('Lecturas','<div class="meter"><span>Carga |Q|</span><b id="capq"></b></div><div class="meter"><span>Constante τ = RC</span><b id="captau"></b></div><div class="meter"><span>Tiempo físico</span><b id="captime"></b></div><div class="meter"><span>Estado</span><b id="capstate"></b></div>')+'<div class="equation">C = κε₀A/d<br>Q = CV · U = Q²/(2C)</div><p class="hint">Tiempo ralentizado: una constante τ tarda aprox. 1.8 s en pantalla. Aislado, Q se conserva al cambiar C.</p>';

function addCharge(sign){if(charges.length>=10){toast('Puedes colocar hasta 10 cargas.');return;}const a=charges.length*2.399;charges.push({x:Math.cos(a)*.6,y:Math.sin(a)*.45,q:sign*electro.mag*1e-9});selected=charges.length-1;inspector();dirty=true;updateReadings();}
function removeCharge(){if(charges[selected]){charges.splice(selected,1);selected=Math.min(selected,charges.length-1);inspector();dirty=true;updateReadings();}}
function particleProps(type){return type==='electron'?{q:-Core.e,m:Core.me,color:blue,label:'electrón'}:type==='alpha'?{q:2*Core.e,m:6.644657e-27,color:purple,label:'alfa'}:{q:Core.e,m:Core.mp,color:red,label:'protón'};}
function capState(){const C=Core.capacitor(cap.area*1e-4,cap.gap*1e-3,cap.k);return{C,V:cap.Q/C,U:cap.Q*cap.Q/(2*C),tau:cap.R*1e6*C};}
function current(){return circuit.closed?circuit.V/circuit.R:0;}
function mState(){const p=particleProps(mag.particle);return{...p,...Core.magnetic(p.q,p.m,mag.v*1e5,mag.B,mag.angle)};}
function updateReadings(){let v1='',v2='',v3='';if(mode===0){v1=charges.length+' / 10';const c=charges[0],d=charges[1];if(c&&d){const r=Math.hypot(c.x-d.x,c.y-d.y);v2=r<.045?'Separación muy pequeña':compact(Core.k*Math.abs(c.q*d.q)/(r*r),'N');}else v2='—';v3=String(particles.length);$('status').textContent=tool==='probe'?'Herramienta de medición activa':'Arrastra · doble clic para eliminar';$('scale-note').textContent='Cargas en nC · modelo de cargas puntuales · '+fmt(1)+' m = '+Math.round(scale)+' px';}
 if(mode===1){const s=capState();v1=compact(s.C,'F');v2=fmt(s.V,'V');v3=compact(s.U,'J');$('capq').textContent=compact(Math.abs(cap.Q),'C');$('captau').textContent=compact(s.tau,'s');$('captime').textContent=compact(cap.t,'s');$('capstate').textContent={charge:'Cargando',discharge:'Descargando',isolated:'Aislado · Q fija'}[cap.connection];$('status').textContent=cap.connection==='isolated'?'Prueba cambiar κ o d y observa V.':'Los electrones no atraviesan el aislante.';$('scale-note').textContent='Placas paralelas ideales · efectos de borde despreciados';}
 if(mode===2){const I=current();v1=fmt(I,'A');v2=fmt(I*I*circuit.R,'W');v3=fmt(circuit.Q,'C');$('energy').textContent=fmt(circuit.energy,'J');$('itime').textContent=fmt(clock,'s');$('istate').textContent=circuit.closed?'Cerrado':'Abierto';$('status').textContent=circuit.closed?'La carga se conserva; la energía se transforma.':'Circuito abierto: corriente estacionaria cero.';$('scale-note').textContent='Batería ideal · resistor óhmico · deriva visual no a escala';}
 if(mode===3){const s=mState();v1=compact(s.F,'N');v2=mag.B&&mag.angle?compact(s.r,'m'):'Sin órbita';v3=fmt(mag.v*1e5,'m/s');$('mq').textContent=fmt(s.q,'C');$('mt').textContent=Number.isFinite(s.T)?compact(s.T,'s'):'—';$('motion').textContent=!mag.B||!mag.angle?'Rectilíneo':mag.angle===90?'Circular':'Helicoidal';$('status').textContent='El campo magnético no cambia la rapidez.';$('scale-note').textContent='Escala automática · '+(mag.angle===0?'vista lateral · B paralelo a v':mag.angle===90?'vista transversal':'proyección transversal de una hélice');}

function resize(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(W/4.3,H/3.1)*zoom;dirty=true;}
const X=x=>W/2+x*scale,Y=y=>H*.55-y*scale;
function point(e){const r=cv.getBoundingClientRect();return{px:e.clientX-r.left,py:e.clientY-r.top,x:(e.clientX-r.left-W/2)/scale,y:-(e.clientY-r.top-H*.55)/scale};}
function findCharge(p){for(let i=charges.length-1;i>=0;i--)if(Math.hypot(X(charges[i].x)-p.px,Y(charges[i].y)-p.py)<23)return i;return-1;}
function cursorRead(p){const f=Core.field(p.x,p.y,charges);if($('cursor-v')){$('cursor-v').textContent=f.inside?'Excluido':fmt(f.V,'V');$('cursor-e').textContent=f.inside?'Excluido':fmt(f.E,'N/C');}const tip=$('tip');tip.innerHTML=f.inside?'Zona de carga: medición excluida':`<div><span>V</span><strong>${fmt(f.V,'V')}</strong></div><div><span>|E|</span><strong>${fmt(f.E,'N/C')}</strong></div><div><span>x, y</span><strong>${fmt(p.x)}, ${fmt(p.y)} m</strong></div>`;tip.style.display='block';tip.style.left=Math.max(8,Math.min(W-200,p.px+18))+'px';tip.style.top=Math.max(105,Math.min(H-95,p.py+15))+'px';}
function arrow(c,x1,y1,x2,y2,color,w=1.5){c.strokeStyle=color;c.fillStyle=color;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();const a=Math.atan2(y2-y1,x2-x1),s=6;c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-s*Math.cos(a-.5),y2-s*Math.sin(a-.5));c.lineTo(x2-s*Math.cos(a+.5),y2-s*Math.sin(a+.5));c.fill();}
function line(c,x1,y1,x2,y2,color,w=1){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=color;c.lineWidth=w;c.stroke();}
function txt(t,x,y,color=ink,size=13,align='center'){ctx.fillStyle=color;ctx.font=`${size}px Segoe UI, sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y);}
function disk(x,y,r,color,label){ctx.save();ctx.shadowColor=color+'38';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.stroke();ctx.restore();if(label)txt(label,x,y,'white',r*1.25);}
function grid(){ctx.fillStyle='#f7fafb';ctx.fillRect(0,0,W,H);ctx.fillStyle='#c3d0d555';for(let x=22;x<W;x+=25)for(let y=14;y<H;y+=25)ctx.fillRect(x,y,1.3,1.3);}
function buildElectro(){const block=12;heat.width=Math.ceil(W/block);heat.height=Math.ceil(H/block);heatW=heat.width;heatH=heat.height;const image=hx.createImageData(heatW,heatH);for(let j=0;j<heatH;j++)for(let i=0;i<heatW;i++){const f=Core.field(((i+.5)*block-W/2)/scale,-((j+.5)*block-H*.55)/scale,charges);const t=Math.tanh(f.V/55),idx=(j*heatW+i)*4;const c=t>=0?[220,106,65]:[73,113,214];image.data[idx]=c[0];image.data[idx+1]=c[1];image.data[idx+2]=c[2];image.data[idx+3]=Math.abs(t)*115;}hx.putImageData(image,0,0);dirty=false;}
function fieldLines(){const pos=charges.filter(c=>c.q>0),seeds=pos.length?pos:charges.filter(c=>c.q<0);ctx.strokeStyle='#327e7955';ctx.lineWidth=1.15;for(const c of seeds){const dir=c.q>0?1:-1;const count=Math.min(18,Math.max(8,Math.abs(c.q)*1e9*4));for(let j=0;j<count;j++){const a=j/count*Math.PI*2;let x=c.x+Math.cos(a)*.07,y=c.y+Math.sin(a)*.07;ctx.beginPath();ctx.moveTo(X(x),Y(y));for(let step=0;step<230;step++){const f=Core.field(x,y,charges);if(f.E<1e-8)break;const nx=x+f.ex/f.E*.025*dir,ny=y+f.ey/f.E*.025*dir;ctx.lineTo(X(nx),Y(ny));if(step%45===25){ctx.stroke();if(dir===1)arrow(ctx,X(x),Y(y),X(nx),Y(ny),'#327e7970',1);else arrow(ctx,X(nx),Y(ny),X(x),Y(y),'#327e7970',1);ctx.beginPath();ctx.moveTo(X(nx),Y(ny));}x=nx;y=ny;if(X(x)<-20||X(x)>W+20||Y(y)<-20||Y(y)>H+20||charges.some(s=>Math.hypot(s.x-x,s.y-y)<.05))break;}ctx.stroke();}}}
function drawElectro(){if(dirty)buildElectro();if(electro.heat){ctx.save();ctx.globalAlpha=.9;ctx.drawImage(heat,0,0,W,H);ctx.restore();}if(electro.lines)fieldLines();if(electro.vectors)for(let x=110;x<W-20;x+=55)for(let y=130;y<H-35;y+=55){const f=Core.field((x-W/2)/scale,-(y-H*.55)/scale,charges);if(f.inside||f.E<1e-8)continue;const len=Math.min(24,8+Math.log1p(f.E)*3);arrow(ctx,x-f.ex/f.E*len/2,y+f.ey/f.E*len/2,x+f.ex/f.E*len/2,y-f.ey/f.E*len/2,'#21675f65',1);}
 particles.forEach(p=>{ctx.strokeStyle=p.color+'99';ctx.lineWidth=1.8;ctx.beginPath();p.trail.forEach((v,i)=>i?ctx.lineTo(X(v.x),Y(v.y)):ctx.moveTo(X(v.x),Y(v.y)));ctx.stroke();disk(X(p.x),Y(p.y),4,p.color);});charges.forEach((c,i)=>{const x=X(c.x),y=Y(c.y);if(i===selected){ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);ctx.strokeStyle='#38535c99';ctx.lineWidth=1;ctx.setLineDash([3,4]);ctx.stroke();ctx.setLineDash([]);}disk(x,y,16,c.q>0?red:c.q<0?blue:muted,c.q>0?'+':c.q<0?'−':'0');txt(fmt(c.q*1e9,'nC'),x,y+34,ink,12);});if(cursor){line(ctx,cursor.px-6,cursor.py,cursor.px+6,cursor.py,'#153c4380');line(ctx,cursor.px,cursor.py-6,cursor.px,cursor.py+6,'#153c4380');}line(ctx,W-110,H-55,W-110+scale*.25,H-55,ink,2);txt('0.25 m',W-110+scale*.125,H-69,muted,10);}
function launchElectro(){if(particles.length>=20)particles.shift();const p=particleProps(electro.particle);particles.push({x:-W/scale*.42,y:(Math.random()-.5)*.65,vx:electro.speed*1e4,vy:0,q:p.q,m:p.m,color:p.color,trail:[]});paused=false;syncPause();updateReadings();}
function stepElectro(dt){const physdt=dt*3e-6;for(let i=particles.length-1;i>=0;i--){const p=particles[i];for(let j=0;j<8;j++){const h=physdt/8,f=Core.field(p.x,p.y,charges);if(f.inside){particles.splice(i,1);break;}p.vx+=p.q*f.ex/p.m*h;p.vy+=p.q*f.ey/p.m*h;p.x+=p.vx*h;p.y+=p.vy*h;}if(particles[i]!==p)continue;p.trail.push({x:p.x,y:p.y});if(p.trail.length>350)p.trail.shift();if(Math.abs(X(p.x)-W/2)>W*.7||Y(p.y)<-100||Y(p.y)>H+100||!Number.isFinite(p.x))particles.splice(i,1);}}

const lessons=[
 ['Cargas, protones y campo eléctrico',`<div><h3>Qué estás viendo</h3><p>Cargas del mismo signo se repelen y de signo contrario se atraen. Los vectores señalan la dirección de la fuerza sobre una carga <b>positiva</b> de prueba. Las líneas salen de + y llegan a −. El mapa representa el potencial escalar, no la intensidad del campo.</p><div class="formula">E = Σ kq r̂/r² · V = Σ kq/r</div></div><div><h3>¿Y los protones?</h3><p>El protón tiene +e y el electrón −e. En los metales, los protones pertenecen a núcleos ligados a la red; se mueven los electrones de conducción. Un protón libre sí puede formar un haz. Al frotar objetos suelen transferirse electrones, no protones.</p></div><div><h3>Prueba esto</h3><p>Prepara dos cargas iguales. Mide en el punto medio: el campo puede ser cero mientras el potencial no lo es. Con dos cargas opuestas iguales, el potencial del punto medio es cero y el campo no. Las partículas de prueba no modifican las fuentes.</p></div>`],
 ['Capacitancia, carga y energía',`<div><h3>Qué hace un capacitor</h3><p>Separa cargas +Q y −Q en dos conductores aislados. Almacena energía en su campo eléctrico. Los electrones llegan o salen por el circuito externo; no atraviesan el dieléctrico ideal.</p><div class="formula">C = κε₀A/d · U = ½CV²</div></div><div><h3>Conectado o aislado</h3><p>Al cargar mediante R, V del capacitor se aproxima al de la batería. Si queda conectado en régimen final, la batería mantiene V y puede cambiar Q. Si se aísla sin fugas, Q permanece fija: aumentar C reduce V. El dieléctrico se polariza y aumenta C.</p></div><div><h3>Serie y paralelo</h3><p>En paralelo: C equivalente = ΣC, con el mismo voltaje en cada uno. En serie: 1/C equivalente = Σ(1/C); para nodos internos inicialmente neutros, cada capacitor tiene igual |Q|. En descarga, Q(t) = Q₀e^(−t/RC). Un flash aprovecha una liberación rápida de energía.</p></div>`],
 ['Corriente y transferencia de energía',`<div><h3>Qué se está moviendo</h3><p>En un metal hay movimiento térmico de electrones y una pequeña deriva neta. La corriente convencional se define con cargas positivas; por eso va en sentido opuesto a los electrones. Los iones positivos de la red no recorren el alambre.</p><div class="formula">I = dQ/dt · V = IR</div></div><div><h3>La carga no se consume</h3><p>En una sola rama estacionaria, la misma corriente entra y sale del resistor. Lo que se transforma es energía, a razón de P = VI. La batería mantiene voltaje convirtiendo energía química en eléctrica.</p></div><div><h3>Los límites del modelo</h3><p>Usamos una batería ideal y un resistor óhmico con R constante. En un alambre, R = ρL/A. Temperatura y material afectan ρ. Una fuente real tiene resistencia interna: V terminal = ε − Ir. No todos los componentes son óhmicos.</p></div>`],
 ['Fuerza magnética y movimiento',`<div><h3>Por qué se curva</h3><p>La fuerza q(v × B) es perpendicular a la velocidad y al campo. Para q negativa, invierte el sentido de la mano derecha. En un campo uniforme con v perpendicular, actúa como fuerza centrípeta y genera una órbita circular.</p><div class="formula">F = |q|vB sen θ · r = mv⊥/|qB|</div></div><div><h3>La rapidez no cambia</h3><p>F·v = 0: el campo magnético no realiza trabajo. Puede cambiar la dirección, sin cambiar la energía cinética. La componente paralela a B se conserva; si existe junto a la perpendicular, la trayectoria es helicoidal. Con v paralela, F es cero.</p></div><div><h3>Más allá de una partícula</h3><p>Las corrientes producen campos: B = μ₀I/(2πr) cerca de un alambre largo. Un conductor siente F = I L × B. Una espira puede girar con torque μ × B. El flujo por un área plana es Φ = BA cos θ, con θ respecto a la normal.</p></div>`]
];

function project3(x,y,z){const a=cam.yaw,b=cam.pitch,c=Math.cos(a),d=Math.sin(a),e=Math.cos(b),f=Math.sin(b);const xx=x*c+z*d,zz=-x*d+z*c,yy=y*e-zz*f,depth=y*f+zz*e;const perspective=5/(5+depth),u=Math.min(W/4.5,H/3)*cam.z;return{x:W*.51+xx*u*perspective,y:H*.56-yy*u*perspective,k:u*perspective,depth};}
function unprojectPlane(px,py){const p0=project3(0,0,0),px1=project3(.001,0,0),py1=project3(0,.001,0);const a=(px1.x-p0.x)/.001,b=(py1.x-p0.x)/.001,c=(px1.y-p0.y)/.001,d=(py1.y-p0.y)/.001,det=a*d-b*c;let x=((px-p0.x)*d-(py-p0.y)*b)/det,y=((py-p0.y)*a-(px-p0.x)*c)/det;for(let j=0;j<6;j++){const p=project3(x,y,0),qx=project3(x+.001,y,0),qy=project3(x,y+.001,0),aa=(qx.x-p.x)/.001,bb=(qy.x-p.x)/.001,cc=(qx.y-p.y)/.001,dd=(qy.y-p.y)/.001,D=aa*dd-bb*cc;if(Math.abs(D)<.001)break;x+=((px-p.x)*dd-(py-p.y)*bb)/D;y+=((py-p.y)*aa-(px-p.x)*cc)/D;}return{x,y};}

function box3(x,y,z,wx,hy,dz,color){const p=[[x-wx/2,y-hy/2,z-dz/2],[x+wx/2,y-hy/2,z-dz/2],[x+wx/2,y+hy/2,z-dz/2],[x-wx/2,y+hy/2,z-dz/2],[x-wx/2,y-hy/2,z+dz/2],[x+wx/2,y-hy/2,z+dz/2],[x+wx/2,y+hy/2,z+dz/2],[x-wx/2,y+hy/2,z+dz/2]];const faces=[[0,1,2,3],[4,5,6,7],[0,4,7,3],[1,5,6,2],[3,2,6,7],[0,1,5,4]];faces.sort((a,b)=>b.reduce((s,i)=>s+project3(...p[i]).depth,0)-a.reduce((s,i)=>s+project3(...p[i]).depth,0));faces.forEach(f=>quad3(f.map(i=>p[i]),color+'40',color+'a0'));}

 if(electro.heat){for(let x=-1.8;x<1.8;x+=.12)for(let y=-.9;y<.95;y+=.12){const f=Core.field(x+.06,y+.06,charges),t=Math.tanh(f.V/50),alpha=Math.round(Math.abs(t)*65).toString(16).padStart(2,'0');quad3([[x,y,0],[x+.12,y,0],[x+.12,y+.12,0],[x,y+.12,0]],(t>0?'#ff9873':'#83a5ff')+alpha);}}
 if(electro.lines){const seeds=charges.some(c=>c.q>0)?charges.filter(c=>c.q>0):charges.filter(c=>c.q<0);for(const c of seeds){const dir=c.q>0?1:-1;for(let j=0;j<20;j++){const t=(j+.5)/20,phi=j*2.39996,sy=1-2*t,rr=Math.sqrt(1-sy*sy);let x=c.x+.085*rr*Math.cos(phi),y=c.y+.085*sy,z=.085*rr*Math.sin(phi);const points=[[x,y,z]];for(let k=0;k<150;k++){const f=field3(x,y,z);if(f.E<1e-8)break;x+=dir*f.ex/f.E*.035;y+=dir*f.ey/f.E*.035;z+=dir*f.ez/f.E*.035;points.push([x,y,z]);if(Math.hypot(x,y,z)>3.7||charges.some(a=>Math.hypot(x-a.x,y-a.y,z)<.065))break;}path3(points,'#8be4d84b',1.05);for(let k=20;k<points.length-1;k+=45)dir>0?arrow3(points[k],points[k+1],'#aaf8dfb0',1):arrow3(points[k+1],points[k],'#aaf8dfb0',1);}}}
 if(electro.vectors)for(let x=-1.5;x<=1.5;x+=.5)for(let y=-.6;y<=.6;y+=.6)for(let z=-.7;z<=.7;z+=.7){const f=field3(x,y,z);if(f.E<.01||charges.some(c=>Math.hypot(c.x-x,c.y-y,z)<.16))continue;const d=.13;arrow3([x,y,z],[x+d*f.ex/f.E,y+d*f.ey/f.E,z+d*f.ez/f.E],'#67b9d46c',1);}
 particles.forEach(p=>{path3(p.trail.map(v=>[v.x,v.y,0]),p.color+'cc',2);sphere3([p.x,p.y,0],.025,p.color);});const order=charges.map((c,i)=>({...c,i,depth:project3(c.x,c.y,0).depth})).sort((a,b)=>b.depth-a.depth);for(const c of order){const p=sphere3([c.x,c.y,0],.105,c.q>0?red:c.q<0?blue:muted,c.q>0?'+':c.q<0?'−':'0');if(c.i===selected){ctx.beginPath();ctx.ellipse(p.x,p.y,.15*p.k,.15*p.k,0,0,Math.PI*2);ctx.setLineDash([3,5]);ctx.strokeStyle='#c7e5ff99';ctx.stroke();ctx.setLineDash([]);}txt(fmt(c.q*1e9,'nC'),p.x,p.y+.2*p.k,ink,12);}
 if(cursor){const p=project3(cursor.x,cursor.y,0);line(ctx,p.x-7,p.y,p.x+7,p.y,'#fff9');line(ctx,p.x,p.y-7,p.x,p.y+7,'#fff9');}dirty=false;
};
drawCap=function(){const s=capState(),g=.25+cap.gap*.13,h=.8+cap.area*.002;box3(-g/2,0,0,.045,h,.75,red);box3(g/2,0,0,.045,h,.75,blue);if(cap.k>1)box3(0,0,0,g-.08,h*.96,.7,'#8be2c9');for(let yy=-h*.35;yy<h*.4;yy+=h*.23)for(let zz=-.25;zz<=.25;zz+=.25){if(cap.Q>1e-16){arrow3([-g/2+.03,yy,zz],[g/2-.03,yy,zz],'#b0f3d47f',1.4);sphere3([-g/2-.04,yy,zz],.019,red,'',false);sphere3([g/2+.04,yy,zz],.019,blue,'',false);}}
 const c=cap.connection,connected=c!=='isolated';path3([[-g/2,h/2,0],[-g/2,h/2+.25,0],[-.13,h/2+.25,0]],'#9db3d3',2);path3([[g/2,h/2,0],[g/2,h/2+.25,0],[.13,h/2+.25,0]],'#9db3d3',2);if(connected){box3(0,h/2+.25,0,.22,.17,.15,c==='charge'?'#dfb86a':'#78b9e5');label3(c==='charge'?cap.V+' V':'R', [0,h/2+.48,0],ink,13);}else{seg3([-.13,h/2+.25,0],[.04,h/2+.4,0],green,2);label3('Q constante',[0,h/2+.57,0],green,12);}label3('+Q',[-g/2-.17,0,.44],red,15);label3('−Q',[g/2+.17,0,.44],blue,15);label3('κ = '+cap.k,[0,-h/2-.18,0],green,13);label3('Campo eléctrico',[0,-h/2-.36,0],muted,11);
 if(!paused&&c!=='isolated'){const fraction=c==='charge'?Math.max(0,1-s.V/cap.V):s.V/cap.V;for(let i=0;i<5;i++){const t=((clock*.5+i/5)%1);sphere3([-g/2,-h/2+t*h,.38],.018,blue,'',false);if(fraction<.01)break;}}
};
drawCurrent=function(){const left=-1.15,right=1.15,near=.7,far=-.7,yy=-.05,I=current();path3([[left,yy,near],[left,yy,far],[right,yy,far],[right,yy,near],[left,yy,near]],'#7b9fcb',4);box3(left,yy,0,.28,.42,.35,'#dfb86a');label3(circuit.V+' V',[left,.35,0],'#e7c884',14);box3(.2,yy,far,.7,.2,.2,red);label3(circuit.R+' Ω',[.2,.26,far],red,14);const sx=.15;box3(sx,yy,near,.6,.07,.25,'#547b99');seg3([sx-.25,yy+.06,near],[sx+.25,yy+(circuit.closed?.06:.38),near],green,4);label3(circuit.closed?'CERRADO':'ABIERTO',[sx,-.28,near],green,11);
 const total=2*(right-left+near-far);for(let i=0;i<35;i++){let t=((i/35*total-clock*(I?.13+I*.8:0))%total+total)%total,x,z;if(t<2.3){x=left+t;z=far;}else if(t<3.7){x=right;z=far+t-2.3;}else if(t<6){x=right-(t-3.7);z=near;}else{x=left;z=near-(t-6);}if(!circuit.closed&&Math.abs(z-near)<.01&&Math.abs(x-sx)<.3)continue;sphere3([x,yy,z],.025,blue,'',false);}if(circuit.conventional&&I>0){arrow3([-.85,.18,far],[-.45,.18,far],green,2);arrow3([.85,.18,near],[.45,.18,near],green,2);label3('I convencional',[0,.3,near],green,12);}for(let i=0;i<6;i++)for(let j=0;j<2;j++)sphere3([-.65+i*.25,-.55,-.15+j*.3],.015,'#6786a2','',false);label3('Red de iones: posiciones fijas',[0,-.82,0],muted,11);
};
drawMag=function(){const s=mState(),straight=!mag.B||!mag.angle,R=.67,center=[0,0,0];if(mag.B)for(let x=-1.2;x<=1.2;x+=.6)for(let z=-.6;z<=.6;z+=.6)arrow3([x,mag.B>0?-.85:.9,z],[x,mag.B>0?.9:-.85,z],'#68b3db38',1);label3(!mag.B?'B = 0':mag.B>0?'B · dirección +y':'B · dirección −y',[1.18,.95,0],blue,12);
 const tracks=magTracks.length?magTracks:[{...s,age:0,B:mag.B,angle:mag.angle,v:mag.v*1e5,preview:true}];for(const p of tracks){const a=p.age*1.6*Math.sign(p.omega||1),helix=p.angle>0&&p.angle<90,shift=helix?p.age*1.6*R/Math.tan(p.angle*Math.PI/180):0;let v;if(!p.B||!p.angle){v=[!p.B?((p.age*.45)%2.6)-1.3:0,!p.angle?((p.age*.45)%2)-.9:0,0];path3(!p.angle?[[0,-1,0],[0,1.1,0]]:[[-1.3,0,0],[1.3,0,0]],'#91a9c099',1.5);}else{v=[R*Math.sin(a),helix?Math.sign(p.B)*shift-.6:0,-R*Math.cos(a)];const guide=[];for(let k=0;k<=90;k++){const theta=k/90*Math.PI*2;guide.push([R*Math.sin(theta),0,R*Math.cos(theta)]);}path3(guide,'#9bb8d34d',1.1,true);arrow3(v,[v[0]*.7,v[1],v[2]*.7],green,2);label3('r = '+compact(s.r,'m'),[0,-.28,0],green,13);}if(!p.preview){p.trail3=p.trail3||[];p.trail3.push(v);if(p.trail3.length>800)p.trail3.shift();path3(p.trail3,p.color+'d0',2.5);}sphere3(v,.055,p.color,p.q>0?'+':'−');label3(p.label,[v[0]+.12,v[1]+.14,v[2]],p.color,12);if(helix)label3('Hélice: giro + avance paralelo',[0,-.95,0],muted,12);}
};
// Arrastre en un plano físico para las cargas; órbita de cámara en el fondo.
function local3(e){const r=cv.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;return{px,py,...unprojectPlane(px,py)};}
function hit3(p){for(let i=charges.length-1;i>=0;i--){const c=project3(charges[i].x,charges[i].y,0);if(Math.hypot(c.x-p.px,c.y-p.py)<Math.max(18,c.k*.13))return i;}return-1;}
cv.addEventListener('pointerdown',e=>{const p=local3(e),i=mode===0?hit3(p):-1;if(i>=0&&tool==='move'){selected=i;drag={index:i,dx:charges[i].x-p.x,dy:charges[i].y-p.y};inspector();}else if(tool!=='probe'||mode!==0)viewDrag={x:e.clientX,y:e.clientY,yaw:cam.yaw,pitch:cam.pitch};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{if(viewDrag){cam.yaw=viewDrag.yaw+(e.clientX-viewDrag.x)*.007;cam.pitch=Math.max(-1.1,Math.min(.8,viewDrag.pitch+(e.clientY-viewDrag.y)*.006));$('tip').style.display='none';return;}if(mode!==0)return;const p=local3(e);cursor=p;if(drag){charges[drag.index].x=p.x+drag.dx;charges[drag.index].y=p.y+drag.dy;if($('position-value'))$('position-value').textContent=fmt(charges[drag.index].x)+', '+fmt(charges[drag.index].y)+' m';updateReadings();}if(tool==='probe'||hit3(p)<0)cursorRead(p);else $('tip').style.display='none';cv.style.cursor=hit3(p)>=0?'grab':tool==='probe'?'crosshair':'move';});
function release3(e){viewDrag=null;drag=null;if(e.pointerId!==undefined&&cv.hasPointerCapture(e.pointerId))cv.releasePointerCapture(e.pointerId);cv.style.cursor='grab';}
cv.addEventListener('pointerup',release3);cv.addEventListener('pointercancel',release3);cv.addEventListener('pointerleave',()=>{cursor=null;$('tip').style.display='none';});cv.addEventListener('dblclick',e=>{if(mode===0){selected=hit3(local3(e));removeCharge();}});cv.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.55,Math.min(2,cam.z*Math.exp(-e.deltaY*.001)));},{passive:false});
const oldInit=initMode;initMode=function(n){stopDemo();cam={yaw:.48,pitch:-.29,z:1};oldInit(n);$('instruction').textContent=['Arrastra una carga para moverla. Arrastra el fondo para girar la escena.','Placas en 3D: carga, aísla y cambia el dieléctrico. Gira la cámara arrastrando.','Circuito espacial: abre el interruptor y sigue la deriva de electrones.','Órbitas y hélices en 3D. Lanza una partícula y gira la escena.'][n];};
const oldRead=updateReadings;updateReadings=function(){oldRead();$('scale-note').textContent=mode===0?'Plano de cargas z = 0 · lecturas en SI · rueda para acercar':mode===1?'Placas 3D · dimensiones visuales adaptadas · modelo ideal':mode===2?'Deriva electrónica ilustrativa · magnitudes físicas en SI':'Geometría 3D · escala y tiempo adaptados · radio físico en instrumentos';};
const oldResize=resize;resize=function(){oldResize();};

stage.addEventListener('click',e=>{if(e.target.id==='zoom-in')cam.z=Math.min(2,cam.z+.15);if(e.target.id==='zoom-out')cam.z=Math.max(.55,cam.z-.15);});
$('orbit3d').onclick=()=>{autoOrbit=!autoOrbit;$('orbit3d').classList.toggle('running',autoOrbit);$('orbit3d').setAttribute('aria-pressed',String(autoOrbit));};$('home3d').onclick=()=>{cam={yaw:.48,pitch:-.29,z:1};};
const tours=[
 [['01 · Atracción entre cargas opuestas','Las líneas de campo salen de la esfera positiva y llegan a la negativa.',()=>preset('dipole')],['02 · Repulsión y superposición','Ahora las dos cargas son positivas. En el punto medio sus campos se cancelan.',()=>preset('same')],['03 · Una carga aislada en el espacio','El campo se distribuye radialmente en tres dimensiones, no solo sobre una hoja.',()=>preset('single')],['04 · Una partícula de prueba','El protón positivo se acelera en el sentido de E. Puedes lanzar un electrón para invertir la fuerza.',()=>{preset('dipole');electro.particle='proton';launchElectro();}]],
 [['01 · Carga mediante una resistencia','La batería separa cargas en las placas. El voltaje del capacitor crece gradualmente.',()=>{cap.k=1;cap.Q=0;cap.connection='charge';inspector();}],['02 · Desconexión de la batería','El capacitor queda aislado y conserva la carga Q.',()=>{cap.connection='isolated';}],['03 · Inserción del dieléctrico','Con Q fija, κ = 4 aumenta C y reduce V. Los electrones no cruzan el aislante.',()=>{cap.k=4;inspector();}],['04 · Descarga','La energía almacenada se transfiere al resistor. La gráfica muestra la caída de voltaje.',()=>{cap.connection='discharge';}]],
 [['01 · Circuito cerrado','La batería mantiene una diferencia de potencial y circula corriente.',()=>{circuit.V=6;circuit.R=30;circuit.closed=true;inspector();}],['02 · Doble resistencia','Con el mismo voltaje, duplicar R reduce la corriente a la mitad.',()=>{circuit.R=60;inspector();}],['03 · Circuito abierto','Sin una trayectoria conductora cerrada, la corriente estacionaria es cero.',()=>{circuit.closed=false;inspector();$('switch').textContent='Cerrar circuito';}],['04 · Dos sentidos diferentes','Los electrones azules se desplazan en sentido contrario a la corriente convencional verde.',()=>{circuit.closed=true;circuit.conventional=true;inspector();}]],
 [['01 · Protón perpendicular al campo','La fuerza magnética desvía la trayectoria, pero no cambia la rapidez.',()=>{mag={particle:'proton',v:3,B:.5,angle:90};magTracks=[];inspector();launchMag();}],['02 · Electrón: signo opuesto','Con B fijo, el signo de la carga invierte el sentido del giro. La escala se adapta a su masa.',()=>{mag.particle='electron';magTracks=[];inspector();launchMag();}],['03 · Una hélice real en el espacio','La componente perpendicular gira; la paralela avanza. Gira la vista para ver la profundidad.',()=>{mag.angle=60;magTracks=[];inspector();launchMag();}],['04 · Velocidad paralela','Para θ = 0°, v × B es cero. La partícula sigue una trayectoria recta.',()=>{mag.angle=0;magTracks=[];inspector();launchMag();}]]
];
function syncDemoTimer(){
 if(demoTimeout!==null){
  if(demoClock.active)demoClock.elapsed=Math.min(demoClock.duration,demoClock.elapsed+(performance.now()-demoStartedAt)/1000);
  clearTimeout(demoTimeout);demoTimeout=null;
 }
 if(!demoClock.active||paused||document.hidden)return;
 demoStartedAt=performance.now();
 demoTimeout=setTimeout(()=>{
  demoTimeout=null;
  if(!demoClock.active||paused||document.hidden)return;
  demoClock.elapsed=0;demoStep();
 },Math.max(0,(demoClock.duration-demoClock.elapsed)*1000));
}
function stopDemo(){
 demoClock.stop();autoOrbit=false;
 $('orbit3d').classList.remove('running');$('orbit3d').setAttribute('aria-pressed','false');
 if($('demo3d')){$('demo3d').textContent='Iniciar demostración';$('demo3d').classList.remove('running');$('demo-caption').classList.remove('show');}
 syncPause();
}
function demoStep(){const step=tours[mode][demoIndex];step[2]();syncPause();updateReadings();$('demo-caption').innerHTML='<b>'+step[0]+'</b><p>'+step[1]+'</p>';$('demo-caption').classList.add('show');demoIndex=(demoIndex+1)%tours[mode].length;}
$('demo3d').onclick=()=>{
 if(demoClock.active){stopDemo();return;}
 demoIndex=0;demoClock.start();paused=false;demoStep();autoOrbit=true;
 $('orbit3d').classList.add('running');$('orbit3d').setAttribute('aria-pressed','true');
 $('demo3d').textContent='Detener demostración';$('demo3d').classList.add('running');syncPause();
};
 $('demo-pause').onclick=()=>{paused=!paused;syncPause();};
document.addEventListener('visibilitychange',()=>{last=performance.now();syncDemoTimer();});
window.addEventListener('keydown',e=>{if(e.key==='Escape')stopDemo();});

initMode(0);requestAnimationFrame(loop);
}
